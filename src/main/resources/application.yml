spring:
  application:
    name: datenportal-sodata
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      whitelabel:
        enabled: false

server:
  server-header: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: false
    info:
      enabled: true
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: false
  health:
    diskspace:
      enabled: false

datenportal:
  catalog:
    source-type: classpath
    classpath-location: published_catalog_full_62_entries.xtf
    http-connect-timeout: 5s
    http-read-timeout: 30s
    max-size: 50MB
  admin:
    reload-token: ${DATENPORTAL_ADMIN_RELOAD_TOKEN:}
  explore:
    enabled: true
    max-preview-rows: 100
    max-result-rows: 10000
    query-timeout-ms: 30000
    charts-enabled: true
    local-history-enabled: true
    ai-enabled: false
    webr-enabled: false
    vega-enabled: false
    mosaic-enabled: false
    geospatial-enabled: false
  search:
    max-results: 500
    default-page-size: 10
    max-page-size: 100
  web-components:
    enabled: true
    version: "0.1.10"
    asset-base-path: "/vendor/so-web-components/0.1.10"
    use-cdn: false

gg:
  jte:
    development-mode: true
