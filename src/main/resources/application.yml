spring:
  application:
    name: datenportal-sodata

datenportal:
  catalog:
    source-type: classpath
    classpath-location: published_catalog_full_54_entries.xtf
    http-connect-timeout: 5s
    http-read-timeout: 30s
    max-size: 50MB
  admin:
    reload-token: ${DATENPORTAL_ADMIN_RELOAD_TOKEN:}
  search:
    max-results: 500
    default-page-size: 20
    max-page-size: 100
  web-components:
    enabled: true
    version: "0.1.9"
    asset-base-path: "/vendor/so-web-components/0.1.9"
    use-cdn: false

gg:
  jte:
    development-mode: true
