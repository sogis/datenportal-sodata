# Minimaler Single-Node Garage-Server für lokale Entwicklung und Demos.
# Nicht produktiv verwenden: keine Redundanz, fixe Secrets, Public Website Endpoint.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "8f0d4b9a3d7c2e1f9a6b5c4d3e2f1a0099887766554433221100ffeeddccbbaa"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "dev-admin-token-change-me"
metrics_token = "dev-metrics-token-change-me"
