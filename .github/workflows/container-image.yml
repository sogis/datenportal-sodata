name: Build and publish container image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE_VERSION_PREFIX: '0.1'
  LOCAL_NATIVE_IMAGE: datenportal-sodata:ci
  LOCAL_JVM_IMAGE: datenportal-sodata-jvm:ci
  DOCKERHUB_NATIVE_IMAGE: docker.io/sogis/datenportal-sodata
  DOCKERHUB_JVM_IMAGE: docker.io/sogis/datenportal-sodata-jvm
  GHCR_NATIVE_IMAGE: ghcr.io/sogis/datenportal-sodata
  GHCR_JVM_IMAGE: ghcr.io/sogis/datenportal-sodata-jvm

jobs:
  application-checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify SBOM integration error handling
        run: python3 -m unittest discover -s tools -p 'test_sbom_integration.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/frontend/explore/package-lock.json

      - name: Run application and frontend checks
        run: ./gradlew clean check -Pdatenportal.playwright.withDeps=true

  build-and-smoke-test:
    needs: application-checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image version
        id: image
        shell: bash
        run: echo "version=${IMAGE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build native image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: native-runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.LOCAL_NATIVE_IMAGE }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=datenportal-sodata-native-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=datenportal-sodata-native-${{ matrix.architecture }}

      - name: Build JVM image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: jvm-runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.LOCAL_JVM_IMAGE }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=datenportal-sodata-jvm-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=datenportal-sodata-jvm-${{ matrix.architecture }}

      - name: Test native binary as an OpenShift-style arbitrary UID
        run: python3 tools/test-container.py --image "$LOCAL_NATIVE_IMAGE" --runtime native

      - name: Test JVM image as an OpenShift-style arbitrary UID
        run: python3 tools/test-container.py --image "$LOCAL_JVM_IMAGE" --runtime jvm

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish smoke-tested architecture images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail

          publish_architecture_image() {
            local source_image="$1"
            local dockerhub_image="$2"
            local ghcr_image="$3"
            local architecture_image_tag="${IMAGE_VERSION}-${IMAGE_ARCHITECTURE}"

            docker tag "$source_image" "${dockerhub_image}:${architecture_image_tag}"
            docker tag "$source_image" "${ghcr_image}:${architecture_image_tag}"
            docker push "${dockerhub_image}:${architecture_image_tag}"
            docker push "${ghcr_image}:${architecture_image_tag}"
          }

          publish_architecture_image "$LOCAL_NATIVE_IMAGE" "$DOCKERHUB_NATIVE_IMAGE" "$GHCR_NATIVE_IMAGE"
          publish_architecture_image "$LOCAL_JVM_IMAGE" "$DOCKERHUB_JVM_IMAGE" "$GHCR_JVM_IMAGE"

  publish-multiarch-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-smoke-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image version
        id: image
        shell: bash
        run: echo "version=${IMAGE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned multiarch manifests
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          publish_manifest() {
            local image="$1"
            local tag="$2"
            docker buildx imagetools create \
              --tag "${image}:${tag}" \
              "${image}:${IMAGE_VERSION}-amd64" \
              "${image}:${IMAGE_VERSION}-arm64"
          }

          publish_manifest "$DOCKERHUB_NATIVE_IMAGE" "$IMAGE_VERSION"
          publish_manifest "$DOCKERHUB_JVM_IMAGE" "$IMAGE_VERSION"
          publish_manifest "$GHCR_NATIVE_IMAGE" "$IMAGE_VERSION"
          publish_manifest "$GHCR_JVM_IMAGE" "$IMAGE_VERSION"

      - name: Verify versioned multiarch manifests before updating latest
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          verify_multiarch_manifest() {
            local image="$1"
            local manifest

            manifest="$(docker buildx imagetools inspect "${image}:${IMAGE_VERSION}")"
            printf '%s\n' "$manifest"
            if ! grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:${IMAGE_VERSION} is missing linux/amd64." >&2
              return 1
            fi
            if ! grep -Eq 'Platform:[[:space:]]+linux/arm64(/v[0-9]+)?([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:${IMAGE_VERSION} is missing linux/arm64." >&2
              return 1
            fi
          }

          for image in \
            "$DOCKERHUB_NATIVE_IMAGE" \
            "$DOCKERHUB_JVM_IMAGE" \
            "$GHCR_NATIVE_IMAGE" \
            "$GHCR_JVM_IMAGE"; do
            verify_multiarch_manifest "$image"
          done

      - name: Publish latest multiarch manifests
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          publish_latest_manifest() {
            local image="$1"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              "${image}:${IMAGE_VERSION}-amd64" \
              "${image}:${IMAGE_VERSION}-arm64"
          }

          publish_latest_manifest "$DOCKERHUB_NATIVE_IMAGE"
          publish_latest_manifest "$DOCKERHUB_JVM_IMAGE"
          publish_latest_manifest "$GHCR_NATIVE_IMAGE"
          publish_latest_manifest "$GHCR_JVM_IMAGE"

      - name: Verify published latest manifests
        shell: bash
        run: |
          set -euo pipefail

          verify_multiarch_manifest() {
            local image="$1"
            local manifest

            manifest="$(docker buildx imagetools inspect "${image}:latest")"
            printf '%s\n' "$manifest"
            if ! grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:latest is missing linux/amd64." >&2
              return 1
            fi
            if ! grep -Eq 'Platform:[[:space:]]+linux/arm64(/v[0-9]+)?([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:latest is missing linux/arm64." >&2
              return 1
            fi
          }

          for image in \
            "$DOCKERHUB_NATIVE_IMAGE" \
            "$DOCKERHUB_JVM_IMAGE" \
            "$GHCR_NATIVE_IMAGE" \
            "$GHCR_JVM_IMAGE"; do
            verify_multiarch_manifest "$image"
          done

  dependency-track:
    name: SBOM / ${{ matrix.project }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-multiarch-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # This integration cannot turn a successful image release into a failed release.
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - architecture: amd64
            image: ghcr.io/sogis/datenportal-sodata
            project: datenportal-native-amd64
          - architecture: arm64
            image: ghcr.io/sogis/datenportal-sodata
            project: datenportal-native-arm64
          - architecture: amd64
            image: ghcr.io/sogis/datenportal-sodata-jvm
            project: datenportal-jvm-amd64
          - architecture: arm64
            image: ghcr.io/sogis/datenportal-sodata-jvm
            project: datenportal-jvm-arm64

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: Log in to GitHub Container Registry
        id: registry
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan published image and upload CycloneDX BOM
        id: sbom
        continue-on-error: true
        env:
          IMAGE_REPOSITORY: ${{ matrix.image }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
          DTRACK_PROJECT: ${{ matrix.project }}
          DTRACK_URL: ${{ vars.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 tools/scan-and-upload-sbom.py \
            --image "$IMAGE_REPOSITORY" \
            --version "${IMAGE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" \
            --architecture "$IMAGE_ARCHITECTURE" \
            --project "$DTRACK_PROJECT" \
            --output "sboms/${DTRACK_PROJECT}.cdx.json"

      - name: Retain generated SBOM
        id: artifact
        if: always() && steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.project }}-${{ github.run_number }}
          path: sboms/*.cdx.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report integration infrastructure errors
        if: always() && (steps.checkout.outcome == 'failure' || steps.buildx.outcome == 'failure' || steps.registry.outcome == 'failure' || steps.sbom.outcome == 'failure' || steps.artifact.outcome == 'failure')
        shell: bash
        run: |
          echo '::warning title=Dependency-Track::SBOM integration infrastructure failed; published images are unaffected.'
          echo 'Warning: SBOM integration infrastructure failed. Inspect the job steps; published images are unaffected.' >> "$GITHUB_STEP_SUMMARY"
