name: Build and publish container image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE_VERSION_PREFIX: '0.1'
  LOCAL_NATIVE_IMAGE: datenportal-sodata:ci
  LOCAL_JVM_IMAGE: datenportal-sodata-jvm:ci
  DOCKERHUB_NATIVE_IMAGE: docker.io/sogis/datenportal-sodata
  DOCKERHUB_JVM_IMAGE: docker.io/sogis/datenportal-sodata-jvm
  GHCR_NATIVE_IMAGE: ghcr.io/sogis/datenportal-sodata
  GHCR_JVM_IMAGE: ghcr.io/sogis/datenportal-sodata-jvm

jobs:
  application-checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/frontend/explore/package-lock.json

      - name: Run application and frontend checks
        run: ./gradlew clean check -Pdatenportal.playwright.withDeps=true

  build-and-smoke-test:
    needs: application-checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image version
        id: image
        shell: bash
        run: echo "version=${IMAGE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build native image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: native-runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.LOCAL_NATIVE_IMAGE }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=datenportal-sodata-native-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=datenportal-sodata-native-${{ matrix.architecture }}

      - name: Build JVM image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: jvm-runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.LOCAL_JVM_IMAGE }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=datenportal-sodata-jvm-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=datenportal-sodata-jvm-${{ matrix.architecture }}

      - name: Smoke-test both images as an OpenShift-style arbitrary UID
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            for container_name in datenportal-sodata-native-smoke datenportal-sodata-jvm-smoke; do
              docker logs "$container_name" 2>/dev/null || true
              docker rm --force "$container_name" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          smoke_test_image() {
            local image="$1"
            local container_name="$2"
            local host_port="$3"

            docker run --detach \
              --name "$container_name" \
              --user 1001230000:0 \
              --publish "${host_port}:8080" \
              --env DATENPORTAL_CATALOG_SOURCE_TYPE=classpath \
              --env DATENPORTAL_CATALOG_CLASSPATH_LOCATION=published_catalog_full_62_entries.xtf \
              --env DATENPORTAL_CATALOG_DOWNLOAD_URL=http://localhost:8081/ch.so.datenportal/downloads \
              --env DATENPORTAL_CATALOG_DUCKDB_SOURCE_TYPE=classpath \
              --env DATENPORTAL_CATALOG_DUCKDB_CLASSPATH_LOCATION=catalog.duckdb \
              "$image" >/dev/null

            local ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent "http://127.0.0.1:${host_port}/actuator/health/liveness" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done

            if [ "$ready" != true ]; then
              echo "Container $image did not become live in time." >&2
              return 1
            fi

            if [ "$(docker exec "$container_name" id -u)" = 0 ]; then
              echo "Container $image is running as root." >&2
              return 1
            fi

            curl --fail --silent "http://127.0.0.1:${host_port}/" >/dev/null
            curl --fail --silent "http://127.0.0.1:${host_port}/catalog/catalog.duckdb" >/dev/null
            docker rm --force "$container_name" >/dev/null
          }

          smoke_test_image "$LOCAL_NATIVE_IMAGE" datenportal-sodata-native-smoke 18082
          smoke_test_image "$LOCAL_JVM_IMAGE" datenportal-sodata-jvm-smoke 18083

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish smoke-tested architecture images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail

          publish_architecture_image() {
            local source_image="$1"
            local dockerhub_image="$2"
            local ghcr_image="$3"
            local architecture_image_tag="${IMAGE_VERSION}-${IMAGE_ARCHITECTURE}"

            docker tag "$source_image" "${dockerhub_image}:${architecture_image_tag}"
            docker tag "$source_image" "${ghcr_image}:${architecture_image_tag}"
            docker push "${dockerhub_image}:${architecture_image_tag}"
            docker push "${ghcr_image}:${architecture_image_tag}"
          }

          publish_architecture_image "$LOCAL_NATIVE_IMAGE" "$DOCKERHUB_NATIVE_IMAGE" "$GHCR_NATIVE_IMAGE"
          publish_architecture_image "$LOCAL_JVM_IMAGE" "$DOCKERHUB_JVM_IMAGE" "$GHCR_JVM_IMAGE"

  publish-multiarch-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-smoke-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image version
        id: image
        shell: bash
        run: echo "version=${IMAGE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned multiarch manifests
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          publish_manifest() {
            local image="$1"
            local tag="$2"
            docker buildx imagetools create \
              --tag "${image}:${tag}" \
              "${image}:${IMAGE_VERSION}-amd64" \
              "${image}:${IMAGE_VERSION}-arm64"
          }

          publish_manifest "$DOCKERHUB_NATIVE_IMAGE" "$IMAGE_VERSION"
          publish_manifest "$DOCKERHUB_JVM_IMAGE" "$IMAGE_VERSION"
          publish_manifest "$GHCR_NATIVE_IMAGE" "$IMAGE_VERSION"
          publish_manifest "$GHCR_JVM_IMAGE" "$IMAGE_VERSION"

      - name: Verify versioned multiarch manifests before updating latest
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          verify_multiarch_manifest() {
            local image="$1"
            local manifest

            manifest="$(docker buildx imagetools inspect "${image}:${IMAGE_VERSION}")"
            printf '%s\n' "$manifest"
            if ! grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:${IMAGE_VERSION} is missing linux/amd64." >&2
              return 1
            fi
            if ! grep -Eq 'Platform:[[:space:]]+linux/arm64(/v[0-9]+)?([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:${IMAGE_VERSION} is missing linux/arm64." >&2
              return 1
            fi
          }

          for image in \
            "$DOCKERHUB_NATIVE_IMAGE" \
            "$DOCKERHUB_JVM_IMAGE" \
            "$GHCR_NATIVE_IMAGE" \
            "$GHCR_JVM_IMAGE"; do
            verify_multiarch_manifest "$image"
          done

      - name: Publish latest multiarch manifests
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          publish_latest_manifest() {
            local image="$1"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              "${image}:${IMAGE_VERSION}-amd64" \
              "${image}:${IMAGE_VERSION}-arm64"
          }

          publish_latest_manifest "$DOCKERHUB_NATIVE_IMAGE"
          publish_latest_manifest "$DOCKERHUB_JVM_IMAGE"
          publish_latest_manifest "$GHCR_NATIVE_IMAGE"
          publish_latest_manifest "$GHCR_JVM_IMAGE"

      - name: Verify published latest manifests
        shell: bash
        run: |
          set -euo pipefail

          verify_multiarch_manifest() {
            local image="$1"
            local manifest

            manifest="$(docker buildx imagetools inspect "${image}:latest")"
            printf '%s\n' "$manifest"
            if ! grep -Eq 'Platform:[[:space:]]+linux/amd64([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:latest is missing linux/amd64." >&2
              return 1
            fi
            if ! grep -Eq 'Platform:[[:space:]]+linux/arm64(/v[0-9]+)?([[:space:]]|$)' <<<"$manifest"; then
              echo "${image}:latest is missing linux/arm64." >&2
              return 1
            fi
          }

          for image in \
            "$DOCKERHUB_NATIVE_IMAGE" \
            "$DOCKERHUB_JVM_IMAGE" \
            "$GHCR_NATIVE_IMAGE" \
            "$GHCR_JVM_IMAGE"; do
            verify_multiarch_manifest "$image"
          done
