name: Build and publish container image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE_VERSION_PREFIX: '0.1'
  LOCAL_IMAGE: datenportal-sodata:ci
  DOCKERHUB_IMAGE: docker.io/sogis/datenportal-sodata
  GHCR_IMAGE: ghcr.io/sogis/datenportal-sodata

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/frontend/explore/package-lock.json

      - name: Run application and frontend checks
        run: ./gradlew clean check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image version
        id: image
        shell: bash
        run: echo "version=${IMAGE_VERSION_PREFIX}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=datenportal-sodata
          cache-to: type=gha,mode=max,scope=datenportal-sodata

      - name: Smoke-test image as an OpenShift-style arbitrary UID
        shell: bash
        run: |
          set -euo pipefail

          container_name=datenportal-sodata-smoke
          cleanup() {
            docker logs "$container_name" 2>/dev/null || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --user 1001230000:0 \
            --publish 18082:8080 \
            --env DATENPORTAL_CATALOG_SOURCE_TYPE=classpath \
            --env DATENPORTAL_CATALOG_CLASSPATH_LOCATION=published_catalog_full_62_entries.xtf \
            --env DATENPORTAL_CATALOG_DOWNLOAD_URL=http://localhost:8081/ch.so.datenportal/downloads \
            --env DATENPORTAL_CATALOG_DUCKDB_SOURCE_TYPE=classpath \
            --env DATENPORTAL_CATALOG_DUCKDB_CLASSPATH_LOCATION=catalog.duckdb \
            "$LOCAL_IMAGE" >/dev/null

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18082/actuator/health/liveness >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo 'Container did not become live in time.' >&2
            exit 1
          fi

          if [ "$(docker exec "$container_name" id -u)" = 0 ]; then
            echo 'Container is running as root.' >&2
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18082/ >/dev/null
          curl --fail --silent http://127.0.0.1:18082/catalog/catalog.duckdb >/dev/null

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to Docker Hub and GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_IMAGE:$IMAGE_VERSION"
          docker tag "$LOCAL_IMAGE" "$GHCR_IMAGE:$IMAGE_VERSION"
          docker push "$DOCKERHUB_IMAGE:$IMAGE_VERSION"
          docker push "$GHCR_IMAGE:$IMAGE_VERSION"
