plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'gg.jte.gradle' version '3.2.4'
}

group = 'ch.so.agi'
description = 'Datenportal Webanwendung Kanton Solothurn'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    luceneVersion = '10.3.2'
    playwrightVersion = '1.60.0'
}

sourceSets {
    main {
        resources {
            srcDir 'spec/fixtures'
        }
    }
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'

    implementation "org.apache.lucene:lucene-core:${luceneVersion}"
    implementation "org.apache.lucene:lucene-analysis-common:${luceneVersion}"
    implementation "org.apache.lucene:lucene-queryparser:${luceneVersion}"

    testImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'playwright'
    }
}

def playwrightBrowsersPath = layout.projectDirectory.dir('.gradle/playwright-browsers').asFile.absolutePath

tasks.register('installPlaywrightChromium', JavaExec) {
    group = 'verification'
    description = 'Installs the Chromium browser used by Playwright tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
    environment 'PLAYWRIGHT_BROWSERS_PATH', playwrightBrowsersPath
}

tasks.register('playwrightTest', Test) {
    group = 'verification'
    description = 'Runs Playwright browser tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    shouldRunAfter tasks.named('test')
    dependsOn tasks.named('installPlaywrightChromium')
    environment 'PLAYWRIGHT_BROWSERS_PATH', playwrightBrowsersPath
    useJUnitPlatform {
        includeTags 'playwright'
    }
}

jte {
    generate()
    binaryStaticContent = true
}

springBoot {
    buildInfo()
}

tasks.named('check') {
    dependsOn tasks.named('playwrightTest')
}

tasks.named('wrapper') {
    gradleVersion = '9.5.1'
    distributionType = Wrapper.DistributionType.BIN
}
